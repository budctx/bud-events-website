name: Notion release evidence
on:
  workflow_run:
    workflows: ["Website checks"]
    types: [completed]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: notion-release-evidence
  cancel-in-progress: false
jobs:
  reconcile:
    # Secret-bearing workflow never checks out PR branches, runs PR artifacts or executes PR code.
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Reconcile CI and Vercel evidence (no gate mutation)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NOTION_TOKEN: ${{ secrets.BUD_NOTION_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.BUD_VERCEL_READ_TOKEN }}
          SOURCE_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [ -z "$NOTION_TOKEN" ]; then
            echo "::warning title=Notion sync not activated::Set BUD_NOTION_TOKEN and share the release evidence database with the integration."
            exit 0
          fi
          node scripts/sync-release-evidence.mjs
