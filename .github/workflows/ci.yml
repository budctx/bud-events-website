name: Website checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  owner-database-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: owner-fixture-only
          POSTGRES_DB: bud_owner_fixture
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - run: node scripts/test-owner-postgres.mjs --local-only
        env:
          BUD_OWNER_SQL_FIXTURE: disposable
          PGHOST: 127.0.0.1
          PGPORT: '55432'
          PGDATABASE: bud_owner_fixture
          PGUSER: postgres
          PGPASSWORD: owner-fixture-only
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck:server
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Record commercial launch blockers (not launch approval)
        run: node scripts/record-launch-readiness.mjs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 7
